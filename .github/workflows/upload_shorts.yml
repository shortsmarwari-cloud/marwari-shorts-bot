name: Run Marwari Shorts Bot

on:
  schedule:
    # Runs every day at 6:00 AM UTC (adjust as needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp moviepy pydub schedule google-api-python-client google-auth-oauthlib google-auth-httplib2 openai-whisper numpy opencv-python-headless

    - name: Run main script
      env:
        # Add your secret tokens or environment keys here if configured in GitHub Secrets
        CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
      run: |
        python main.py