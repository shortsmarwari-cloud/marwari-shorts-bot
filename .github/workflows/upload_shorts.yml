name: Run Marwari Shorts Bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js (Provides JS Runtime for yt-dlp)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp
        pip install moviepy pydub schedule google-api-python-client google-auth-oauthlib google-auth-httplib2 Pillow opencv-python-headless requests numpy

    - name: Run main script
      env:
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        python main.py