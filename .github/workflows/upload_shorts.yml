name: Run Marwari Shorts Bot

on:
  schedule:
    - cron: '0 */4 * * *' # Auto-runs every 4 hours
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js (Fixes yt-dlp JS Runtime)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp
        pip install moviepy pydub google-api-python-client google-auth-oauthlib google-auth-httplib2 Pillow opencv-python-headless requests numpy

    - name: Run Pipeline
      env:
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        python main.py